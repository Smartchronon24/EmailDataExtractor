<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">EmailDataExtractor system architecture</title>
  <desc id="desc">Architecture diagram showing Outlook email ingestion, Flask API orchestration, staged AI processing, ChromaDB and MySQL retrieval, Ollama drafting, and human review before sending.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081526"/>
      <stop offset="1" stop-color="#102d3d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17364a"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#41d6c3"/>
      <stop offset="1" stop-color="#79e2a7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7da4b4"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#62ddc2"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', sans-serif; fill: #f3faf9; letter-spacing: .2px; }
      .subtitle { font: 400 16px 'Segoe UI', sans-serif; fill: #a9c4cc; }
      .section { font: 700 14px 'Segoe UI', sans-serif; fill: #7fe2cb; letter-spacing: 2px; }
      .node-title { font: 700 18px 'Segoe UI', sans-serif; fill: #f3faf9; }
      .node-text { font: 400 14px 'Segoe UI', sans-serif; fill: #b5cbd1; }
      .small { font: 600 12px 'Segoe UI', sans-serif; fill: #8eabb5; letter-spacing: .5px; }
      .badge { font: 700 12px 'Segoe UI', sans-serif; fill: #09202b; letter-spacing: .8px; }
      .flow { font: 600 12px 'Segoe UI', sans-serif; fill: #9dc1c8; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <path d="M0 120 H1600" stroke="#244656" stroke-width="1"/>
  <text x="74" y="66" class="title">EmailDataExtractor</text>
  <text x="74" y="94" class="subtitle">RAG-enhanced email orchestration with deterministic deduplication and human-controlled replies</text>
  <rect x="1320" y="48" width="198" height="32" rx="16" fill="#173f4b" stroke="#397d78"/>
  <text x="1419" y="69" text-anchor="middle" class="badge">PIPELINE STABILIZATION</text>

  <text x="74" y="158" class="section">INGESTION &amp; EXPERIENCE</text>
  <rect x="74" y="180" width="1452" height="180" rx="16" fill="#0d2233" stroke="#294958"/>

  <g filter="url(#shadow)">
    <rect x="112" y="219" width="220" height="100" rx="12" fill="url(#panel)" stroke="#3a6472"/>
    <text x="134" y="252" class="node-title">Client</text>
    <text x="134" y="277" class="node-text">Incoming email / reply</text>
    <text x="134" y="299" class="node-text">Human approval</text>

    <rect x="410" y="219" width="260" height="100" rx="12" fill="url(#panel)" stroke="#3a6472"/>
    <text x="432" y="252" class="node-title">Outlook + Graph API</text>
    <text x="432" y="277" class="node-text">Latest unread messages</text>
    <text x="432" y="299" class="node-text">Attachments and metadata</text>

    <rect x="748" y="219" width="270" height="100" rx="12" fill="url(#panel)" stroke="#62ddc2" stroke-width="2"/>
    <text x="770" y="252" class="node-title">Flask Dashboard</text>
    <text x="770" y="277" class="node-text">Web UI and editable drafts</text>
    <text x="770" y="299" class="node-text">SSE processing updates</text>

    <rect x="1096" y="219" width="380" height="100" rx="12" fill="url(#panel)" stroke="#3a6472"/>
    <text x="1118" y="252" class="node-title">app.py API boundary</text>
    <text x="1118" y="277" class="node-text">Fetch, process, send, health endpoints</text>
    <text x="1118" y="299" class="node-text">Persistent MSAL token cache</text>
  </g>
  <path d="M332 269 H400" stroke="#7da4b4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M670 269 H738" stroke="#7da4b4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1018 269 H1086" stroke="#62ddc2" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="347" y="255" class="flow">fetch</text>
  <text x="682" y="255" class="flow">render</text>
  <text x="1027" y="255" class="flow">trigger</text>

  <text x="74" y="407" class="section">ORCHESTRATION PIPELINE</text>
  <rect x="74" y="429" width="1452" height="278" rx="16" fill="#0d2233" stroke="#294958"/>
  <text x="104" y="466" class="small">NORMAL PATH</text>

  <g filter="url(#shadow)">
    <rect x="104" y="492" width="256" height="142" rx="12" fill="url(#panel)" stroke="#e8bc68" stroke-width="2"/>
    <rect x="104" y="492" width="256" height="8" rx="4" fill="#e8bc68"/>
    <text x="128" y="533" class="node-title">Stage 0</text>
    <text x="128" y="558" class="node-text">Deterministic deduplication</text>
    <text x="128" y="583" class="node-text">Message, thread, semantic,</text>
    <text x="128" y="604" class="node-text">invoice and tracking checks</text>

    <rect x="427" y="492" width="256" height="142" rx="12" fill="url(#panel)" stroke="#62ddc2" stroke-width="2"/>
    <rect x="427" y="492" width="256" height="8" rx="4" fill="#62ddc2"/>
    <text x="451" y="533" class="node-title">Stage 1</text>
    <text x="451" y="558" class="node-text">Strategy mapping</text>
    <text x="451" y="583" class="node-text">Intent, support strategy and</text>
    <text x="451" y="604" class="node-text">thread history context</text>

    <rect x="750" y="492" width="256" height="142" rx="12" fill="url(#panel)" stroke="#62ddc2" stroke-width="2"/>
    <rect x="750" y="492" width="256" height="8" rx="4" fill="#62ddc2"/>
    <text x="774" y="533" class="node-title">Stage 2</text>
    <text x="774" y="558" class="node-text">Entity extraction</text>
    <text x="774" y="583" class="node-text">Invoice, tracking, customer</text>
    <text x="774" y="604" class="node-text">lookups and attachment tools</text>

    <rect x="1073" y="492" width="256" height="142" rx="12" fill="url(#panel)" stroke="#62ddc2" stroke-width="2"/>
    <rect x="1073" y="492" width="256" height="8" rx="4" fill="#62ddc2"/>
    <text x="1097" y="533" class="node-title">Stage 3</text>
    <text x="1097" y="558" class="node-text">Live draft generation</text>
    <text x="1097" y="583" class="node-text">Grounded reply from verified</text>
    <text x="1097" y="604" class="node-text">business data and RAG</text>
  </g>
  <path d="M360 563 H417" stroke="#62ddc2" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <path d="M683 563 H740" stroke="#62ddc2" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <path d="M1006 563 H1063" stroke="#62ddc2" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="372" y="548" class="flow">new inquiry</text>
  <text x="695" y="548" class="flow">strategy</text>
  <text x="1016" y="548" class="flow">entities</text>

  <rect x="104" y="658" width="1230" height="30" rx="8" fill="#3d3020" stroke="#80633a"/>
  <text x="719" y="678" text-anchor="middle" class="flow" fill="#f1d79c">DUPLICATE / REPLIED MATCH  →  bypass Stages 1–2  →  reconstruct from historical metadata</text>
  <path d="M232 634 V673" stroke="#e8bc68" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="74" y="754" class="section">DATA, MODEL &amp; CONTROL PLANE</text>
  <rect x="74" y="776" width="1452" height="194" rx="16" fill="#0d2233" stroke="#294958"/>
  <g filter="url(#shadow)">
    <rect x="112" y="816" width="264" height="112" rx="12" fill="url(#panel)" stroke="#6a92a2"/>
    <text x="136" y="851" class="node-title">ChromaDB</text>
    <text x="136" y="877" class="node-text">Semantic memory / RAG</text>
    <text x="136" y="899" class="node-text">Historical email metadata</text>

    <rect x="462" y="816" width="264" height="112" rx="12" fill="url(#panel)" stroke="#6a92a2"/>
    <text x="486" y="851" class="node-title">MySQL</text>
    <text x="486" y="877" class="node-text">Business source of truth</text>
    <text x="486" y="899" class="node-text">Invoices, customers, status</text>

    <rect x="812" y="816" width="264" height="112" rx="12" fill="url(#panel)" stroke="#6a92a2"/>
    <text x="836" y="851" class="node-title">Ollama</text>
    <text x="836" y="877" class="node-text">Local Llama 3.1 / 3.2</text>
    <text x="836" y="899" class="node-text">Strategy, extraction, drafting</text>

    <rect x="1162" y="816" width="306" height="112" rx="12" fill="url(#panel)" stroke="#62ddc2" stroke-width="2"/>
    <text x="1186" y="851" class="node-title">Review and send</text>
    <text x="1186" y="877" class="node-text">Edit draft, approve, send reply</text>
    <text x="1186" y="899" class="node-text">Mark email REPLIED safely</text>
  </g>
  <path d="M232 816 V716" stroke="#7da4b4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M594 816 V716" stroke="#7da4b4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M944 816 V716" stroke="#7da4b4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1200 816 V716" stroke="#62ddc2" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <path d="M1329 634 V806" stroke="#62ddc2" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="242" y="742" class="flow">retrieve / store</text>
  <text x="604" y="742" class="flow">lookup / log</text>
  <text x="954" y="742" class="flow">generate JSON</text>
  <text x="1210" y="742" class="flow">human decision</text>

  <text x="74" y="1010" class="small">Core modules: app.py · main.py · processor.py · stage0_agent.py · vectorstore.py · database.py</text>
  <text x="1526" y="1010" text-anchor="end" class="small">local-first · grounded · auditable</text>
</svg>
